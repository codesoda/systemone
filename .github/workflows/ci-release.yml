name: CI and tagged releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Select build targets
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        run: |
          set -euo pipefail
          linux='{"runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","expected_arch":"x86_64","package_features":"native","workspace_features":"systemone-cli/native,systemone-cli/laya-cpu"}'
          mac='{"runner":"macos-14","target":"aarch64-apple-darwin","expected_arch":"arm64","package_features":"metal","workspace_features":"systemone-cli/metal"}'
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "matrix=[$linux,$mac]" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[$linux]" >> "$GITHUB_OUTPUT"
          fi

  # Linux runs on every push and PR: lint, tests, packaging suites, build,
  # package. macOS minutes are expensive, so the macOS job runs only for
  # release tags, and only builds and packages.
  build-test-package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    needs: plan
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - name: Check out the event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify event commit and runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          git diff --exit-code

      - name: Install Rust 1.95.0 components
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.95.0 --no-self-update --component rustfmt --component clippy
          rustc --version
          cargo --version

      - name: Cache pinned Cargo dependencies and native build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: systemone-v1-${{ matrix.target }}-rust195-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.github/workflows/ci-release.yml') }}

      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential clang libclang-dev cmake pkg-config

      - name: Configure portable native build
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            {
              echo 'GGML_METAL=ON'
              echo 'GGML_METAL_EMBED_LIBRARY=ON'
              echo 'GGML_NATIVE=OFF'
              echo 'MACOSX_DEPLOYMENT_TARGET=14.0'
              echo 'CMAKE_OSX_DEPLOYMENT_TARGET=14.0'
            } >> "$GITHUB_ENV"
          else
            {
              echo 'GGML_METAL=OFF'
              echo 'GGML_NATIVE=OFF'
              echo 'GGML_SSE42=OFF'
              echo 'GGML_AVX=OFF'
              echo 'GGML_AVX_VNNI=OFF'
              echo 'GGML_AVX2=OFF'
              echo 'GGML_BMI2=OFF'
              echo 'GGML_AVX512=OFF'
              echo 'GGML_AVX512_VBMI=OFF'
              echo 'GGML_AVX512_VNNI=OFF'
              echo 'GGML_AVX512_BF16=OFF'
              echo 'GGML_FMA=OFF'
              echo 'GGML_F16C=OFF'
              echo 'RUSTFLAGS=-Ctarget-cpu=x86-64'
            } >> "$GITHUB_ENV"
          fi

      - name: Validate release ref
        shell: bash
        run: python3 scripts/release.py validate-ref --ref "$GITHUB_REF"

      - name: Check license bundle and packaging tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_third_party_licenses.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy default (backend-disabled) workspace
        if: runner.os == 'Linux'
        shell: bash
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test default (backend-disabled) workspace
        if: runner.os == 'Linux'
        shell: bash
        run: cargo test --locked --workspace --all-targets

      - name: Clippy native workspace
        if: runner.os == 'Linux'
        shell: bash
        env:
          WORKSPACE_FEATURES: ${{ matrix.workspace_features }}
        run: cargo clippy --locked --workspace --all-targets --features "$WORKSPACE_FEATURES" -- -D warnings

      - name: Test native workspace without model downloads
        if: runner.os == 'Linux'
        shell: bash
        env:
          WORKSPACE_FEATURES: ${{ matrix.workspace_features }}
        run: |
          set -euo pipefail
          cargo test --locked --workspace --all-targets --features "$WORKSPACE_FEATURES"
          test -z "$(find "$HOME/.cache/openjev" -type f -name '*.gguf' -print -quit 2>/dev/null || true)"

      - name: Build release executable
        shell: bash
        env:
          PACKAGE_FEATURES: ${{ matrix.package_features }}
        run: cargo build --locked --release -p systemone-cli --features "$PACKAGE_FEATURES"

      - name: Verify native CMake release configuration
        shell: bash
        run: |
          set -euo pipefail
          cache=$(find target/release/build -path '*/llama-cpp-sys-2-*/out/build/CMakeCache.txt' -print -quit)
          test -n "$cache"
          python3 scripts/check_native_build.py --platform "$RUNNER_OS" "$cache"

      - name: Smoke the release executable without models
        shell: bash
        run: |
          set -euo pipefail
          bin=target/release/s1
          "$bin" --version | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v["schema"]=="systemone-version-v1" and v["build"].startswith("native"), v'
          "$bin" --no-config backends >/dev/null
          "$bin" --no-config config check >/dev/null
          "$bin" --no-config models --backend local >/dev/null
          # Offline one-shot must fail explicitly (no weights on the runner), never fall back.
          set +e
          printf 'x' | "$bin" --no-config --set backends.local.settings.offline=true noul --question 'q' >/dev/null 2>err.json
          code=$?
          set -e
          test "$code" -eq 1
          python3 -c 'import json; e=json.load(open("err.json"))["error"]; assert e["code"] in ("unavailable","runtime"), e'

      - name: Package and smoke outside checkout
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          rust_version=$(rustc --version)
          archive=$(python3 scripts/release.py package \
            --binary target/release/s1 \
            --target "$RELEASE_TARGET" \
            --source-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --rust-version "$rust_version" \
            --workflow-run-url "$WORKFLOW_RUN_URL" \
            --output-dir dist)
          python3 scripts/release.py verify \
            --archive "$archive" \
            --expected-target "$RELEASE_TARGET" \
            --expected-source-sha "$GITHUB_SHA" \
            --check-linkage

      - name: Upload ordinary workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s1-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # The ONNX Runtime static library that ort downloads needs glibc 2.38 and
  # the GCC 13 libstdc++. The release job stays on ubuntu-22.04 to keep the
  # glibc 2.35 floor, so the gliner2 feature gets its own job on 24.04.
  # GLiNER2 is not in release binaries.
  gliner2-linux:
    name: gliner2 (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Check out the event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0 components
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.95.0 --no-self-update --component clippy
          rustc --version

      - name: Cache pinned Cargo dependencies and build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: systemone-gliner2-v1-ubuntu2404-rust195-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.github/workflows/ci-release.yml') }}

      - name: Clippy with gliner2
        shell: bash
        run: cargo clippy --locked --workspace --all-targets --features systemone-cli/gliner2 -- -D warnings

      - name: Test with gliner2 without model downloads
        shell: bash
        run: cargo test --locked --workspace --all-targets --features systemone-cli/gliner2

  publish-release:
    name: Publish immutable tag assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-test-package, gliner2-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the tag commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Download macOS archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: s1-aarch64-apple-darwin
          path: dist

      - name: Download Linux archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: s1-x86_64-unknown-linux-gnu
          path: dist

      - name: Verify tag, archives, and checksums
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF")" = "$GITHUB_SHA"
          python3 scripts/release.py validate-ref --ref "$GITHUB_REF" --require-tag
          python3 scripts/release.py notes --tag "$TAG" >/dev/null
          version=${TAG#v}
          mac_archive="dist/s1-v${version}-aarch64-apple-darwin.tar.gz"
          linux_archive="dist/s1-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          python3 scripts/release.py verify --archive "$mac_archive" \
            --expected-version "$version" --expected-target aarch64-apple-darwin \
            --expected-source-sha "$GITHUB_SHA" --skip-execute
          python3 scripts/release.py verify --archive "$linux_archive" \
            --expected-version "$version" --expected-target x86_64-unknown-linux-gnu \
            --expected-source-sha "$GITHUB_SHA" --skip-execute
          python3 scripts/release.py checksums --output dist/SHA256SUMS "$mac_archive" "$linux_archive"
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Publish GitHub Release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite immutable assets" >&2
            exit 1
          fi
          version=${TAG#v}
          notes=$(mktemp)
          trap 'rm -f "$notes"' EXIT
          printf '%s\n' \
            "Automated SystemOne \`s1\` binary release from commit \`$GITHUB_SHA\`." \
            "" \
            "Workflow: $RUN_URL" \
            "" \
            "Includes Apple Silicon macOS 14+ Metal and x86-64 glibc 2.35+ CPU archives. No model weights are included. The macOS binary is not Developer ID signed or Apple notarized." \
            "" \
            > "$notes"
          python3 scripts/release.py notes --tag "$TAG" >> "$notes"
          gh release create "$TAG" \
            "dist/s1-v${version}-aarch64-apple-darwin.tar.gz" \
            "dist/s1-v${version}-x86_64-unknown-linux-gnu.tar.gz" \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "SystemOne $TAG" \
            --notes-file "$notes"
