[package]
name = "systemone-laya"
description = "SystemOne host adapter over the laya-core decision runtime (ModernBERT/mmBERT encoders with calibrated decision heads)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Link the laya-core runtime. Without it the adapter validates settings and
# reports `available = false`; `load` fails explicitly.
laya = ["dep:laya-core"]
# Backends inside laya-core. `laya-metal` is macOS-only (MLX); `laya-cpu`
# is portable (Candle, fp32).
laya-cpu = ["laya", "laya-core/candle-accelerate"]
laya-metal = ["laya", "laya-core/mlx"]

[dependencies]
laya-core = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
systemone-core.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
