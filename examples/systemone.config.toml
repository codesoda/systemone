# Example s1 configuration (~/.systemone/systemone.config.toml or ./systemone.config.toml).
# Precedence: built-ins < user file < CWD file < SYSTEMONE_* < CLI.
default_backend = "local"

[server]
host = "127.0.0.1"
port = 8080

[backends.local]
kind = "openjev"
enabled = true
model = "qwen3-0.6b"

[backends.local.settings]
device = "cpu"
threads = 4

# Opt in only when a Metal-enabled build is available on Apple Silicon:
# device = "metal"

# TypeSafe: the hosted Jev API at https://api.typesafe.ai. No build feature
# is needed. The key is read at startup from the named environment variable;
# it never lives in this file. `s1 backends` reports the instance
# unavailable while that variable is unset or empty, and never probes the
# API, because a probe request is billed.
[backends.cloud-typesafe]
kind = "typesafe"
enabled = false
model = "jev-latest"

[backends.cloud-typesafe.settings]
api_key_env = "TYPESAFE_API_KEY"

# The two gateway kinds below are planned. A build refuses them today with
# "the adapter is not implemented in this build".
[backends.cloud-vercel]
kind = "vercel"
enabled = false
model = "jev-latest"

[backends.cloud-vercel.settings]
api_key_env = "AI_GATEWAY_API_KEY"

[backends.cloud-openrouter]
kind = "openrouter"
enabled = false
model = "jev-latest"

[backends.cloud-openrouter.settings]
api_key_env = "OPENROUTER_API_KEY"

# Laya: a directory holding one pinned profile (verified by SHA-256 at load).
# Needs a build with --features laya-cpu (device = "cpu") or laya-metal.
[backends.laya]
kind = "laya"
enabled = false

[backends.laya.settings]
profile = "english"                 # english | multilingual | typed-decisions
model_dir = "~/models/laya/english"
device = "cpu"                      # or "metal" on Apple Silicon
# cache_dir = "~/Library/Caches/laya-rs"   # Metal kernel library location
# precision = "f32"                        # "f16" is Metal-only, opt-in
# verify_sha256 = true

# GLiNER2: a GLiNER2.5 bundle directory from codesoda/gliner2-onnx (the four
# classification files are verified against export_manifest.json at load).
# Needs a build with --features gliner2. CPU only.
[backends.gliner2]
kind = "gliner2"
enabled = false

[backends.gliner2.settings]
profile = "base"                    # small | base | multi
model_dir = "~/models/gliner2.5-base-v1"
# intra_threads = 4
# inter_threads = 2                 # unset keeps sequential execution
# optimization = "all"              # disable | basic | extended | all
# verify_sha256 = true
# noul_labels = ["no", "yes"]       # [false_label, true_label]
