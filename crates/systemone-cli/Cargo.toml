[package]
name = "systemone-cli"
description = "s1: one CLI and Jev-compatible HTTP API for local and hosted decision models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "s1"
path = "src/main.rs"

[features]
default = []
# Local OpenJev inference (compiles llama.cpp).
native = ["systemone-openjev/native"]
metal = ["native", "systemone-openjev/metal"]
cuda = ["native", "systemone-openjev/cuda"]
# Local Laya inference. `laya-cpu` is portable (Candle); `laya-metal` is
# macOS-only (MLX) and also enables the CPU backend for mixed configs.
laya-cpu = ["systemone-laya/laya-cpu"]
laya-accelerate = ["laya-cpu", "systemone-laya/laya-accelerate"]
laya-metal = ["laya-accelerate", "systemone-laya/laya-metal"]

[dependencies]
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
systemone-config.workspace = true
systemone-core.workspace = true
systemone-http.workspace = true
systemone-laya.workspace = true
systemone-openjev.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
systemone-http = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
