[workspace]
members = [
    "crates/systemone-core",
    "crates/systemone-config",
    "crates/systemone-openjev",
    "crates/systemone-remote",
    "crates/systemone-http",
    "crates/systemone-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/codesoda/systemone"

[workspace.dependencies]
systemone-core = { path = "crates/systemone-core" }
systemone-config = { path = "crates/systemone-config" }
systemone-openjev = { path = "crates/systemone-openjev" }
systemone-remote = { path = "crates/systemone-remote" }
systemone-http = { path = "crates/systemone-http" }

# Upstream inference libraries are pinned to reviewed Git revisions. They must
# never depend on SystemOne, and release builds must not use path overrides.
openjev-core = { git = "https://github.com/codesoda/openjev-rs.git", rev = "8452ef0e5890497deb2cec95f16dc8d94d0c0c02" }
openjev-llama = { git = "https://github.com/codesoda/openjev-rs.git", rev = "8452ef0e5890497deb2cec95f16dc8d94d0c0c02", default-features = false }

axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "=4.6.7", features = ["derive", "string"] }
http-body-util = "=0.1.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "blocking"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "=1.1.5", default-features = false, features = ["std", "serde", "parse", "display"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

# dev
futures-util = "=0.3.34"
tempfile = "=3.27.0"
tower = { version = "=0.5.2", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
